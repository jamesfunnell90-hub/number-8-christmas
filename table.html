<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Table plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1f17;--panel:#17382b;--line:#2f5443;--gold:#d4b36a;--ink:#f4ecd6;--dim:#b9c4b3;--berry:#c4523f;
--script:"Pinyon Script","Snell Roundhand",cursive;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
*{font-variant-numeric:lining-nums!important}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 16px 52px;text-align:center;pointer-events:none;
 background:linear-gradient(rgba(12,31,23,.97) 0,rgba(12,31,23,.93) 66%,rgba(12,31,23,0))}
.top .e{font:500 12px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.top h1{margin:5px 0 0;font:600 clamp(28px,8.6vw,40px)/1.1 var(--serif);color:var(--ink)}
.top p{margin:4px 0 0;font:italic 500 clamp(15px,4.4vw,20px)/1.2 var(--serif);color:var(--dim);min-height:1.2em}
.top p b{color:var(--gold);font-weight:600}
.top .nb{margin:6px 0 0;font:500 12px/1.3 var(--sans);letter-spacing:.04em;color:var(--dim);opacity:.85}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:26px 16px calc(env(safe-area-inset-bottom) + 16px);
 background:linear-gradient(rgba(12,31,23,0),rgba(12,31,23,.92));pointer-events:none}
button{font:500 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;border-radius:999px;height:44px;padding:0 18px;border:1px solid var(--gold);cursor:pointer;pointer-events:auto;transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s}
button:active{transform:scale(.96);filter:brightness(1.12)}
.solid{background:linear-gradient(180deg,#e2c47e,#c9a55a);color:#10291f;box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.ghost{background:rgba(16,41,31,.6);color:var(--gold)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .6s;z-index:5;text-align:center}
#load.gone{opacity:0;pointer-events:none}
#load i{display:block;width:180px;height:3px;background:var(--line);border-radius:3px;margin:14px auto 0;overflow:hidden}
#load i b{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#load span{font:500 22px var(--serif)}
#lay{display:block;width:min(220px,58vw);height:auto;margin:0 auto 18px;overflow:visible}
#lay .pl{opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(-14px) scale(1.35);transition:opacity .32s ease-out,transform .42s cubic-bezier(.2,1.4,.4,1)}
#lay .pl.on{opacity:1;transform:none}
#lay.clear .pl{opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);font-size:12px;color:var(--dim);
 background:rgba(12,31,23,.7);padding:6px 12px;border-radius:999px;pointer-events:none;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 24px);opacity:1 !important}
#flat{display:none;position:fixed;inset:0;overflow:auto;padding:130px 16px 100px}
#flat .tbl{max-width:360px;margin:0 auto;display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center}
#flat .s{padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
#flat .s.me{background:var(--gold);color:#1b1608;font-weight:700;border-color:var(--gold)}
#flat .mid{grid-column:2;background:#f4ecd6;border-radius:6px;opacity:.9}
#flat .pair{grid-column:1/-1;display:flex;gap:8px;justify-content:center}
#flat .pair .s,#flat .head{min-width:110px}
#flat .head{grid-column:1/-1;justify-self:center}
#flat small{display:block;text-align:center;color:var(--dim);margin:10px 0}
</style>
</head>

<div id="flat"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
/* Table plan viewer. Who is looking comes from ?me=Name (the main app passes the signed-in guest). */
const qs = new URLSearchParams(location.search);
const ME = (qs.get('me') || '').trim();
const $ = id => document.getElementById(id);

// loading screen: the table is laid one place at a time, and stays up until the whole table is laid at least once
const layT0 = performance.now(), LAY_STEP = 150, LAY_MIN = 15 * LAY_STEP + 500;
(function layLoop(){
  const pls = [...document.querySelectorAll('#lay .pl')], lay = $('lay'); let i = 0;
  const tick = () => {
    if ($('load').classList.contains('gone')) return;
    if (i < pls.length) { pls[i++].classList.add('on'); setTimeout(tick, LAY_STEP); }
    else { setTimeout(() => { lay.classList.add('clear'); setTimeout(() => { pls.forEach(p => p.classList.remove('on')); lay.classList.remove('clear'); i = 0; setTimeout(tick, 250); }, 500); }, 900); }
  };
  setTimeout(tick, 200);
})();
function hideLoad(){ setTimeout(() => $('load').classList.add('gone'), Math.max(0, LAY_MIN - (performance.now() - layT0))); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const seatData = await fetch('seats.json', {cache:'no-cache'}).then(r => r.json()).then(j => j.seats).catch(() => ({}));
const mySeatNo = Object.keys(seatData).find(k => seatData[k].toLowerCase() === ME.toLowerCase());
const subDefault = mySeatNo ? 'Your place is glowing <b>gold</b>' : 'Every place card has a name on it';
$('sub').innerHTML = subDefault;
if (!mySeatNo) $('bMine').style.display = 'none';

function flatPlan(){            // plain top-down plan for phones that cannot draw 3D
  const el = $('flat'), s = (n, c = '') => '<div class="s ' + c + (String(n) === mySeatNo ? ' me' : '') + '">' + esc(seatData[n] || '') + '</div>';
  let h = '<small>French doors</small><div class="tbl"><div class="pair">' + s(9) + s(8) + '</div>';
  for (let i = 0; i < 6; i++) h += s(10 + i) + (i === 0 ? '<div class="mid" style="grid-row:span 6;height:100%"></div>' : '') + s(7 - i);
  h += s(1, 'head') + '</div><small>Kitchen on the left · sofa and garden on the right</small>';
  el.innerHTML = h; el.style.display = 'block';
  ['stage', 'hint', 'bRoom', 'bMine'].forEach(i => $(i).style.display = 'none');
  hideLoad();
}

let THREE, OrbitControls, GLTFLoader, RoomEnvironment;
try {
  THREE = await import('three');
  ({OrbitControls} = await import('three/addons/controls/OrbitControls.js'));
  ({GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js'));
  ({RoomEnvironment} = await import('three/addons/environments/RoomEnvironment.js'));
  const t = document.createElement('canvas'); if (!(t.getContext('webgl2') || t.getContext('webgl'))) throw new Error('no webgl');
} catch (e) { flatPlan(); throw e; }
try { await Promise.race([Promise.all([document.fonts.load('80px "Pinyon Script"'), document.fonts.load('600 80px "Cormorant Garamond"')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
function canvasTex(w, h, draw, opts = {}){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; if (opts.gltf) t.flipY = false; return t;
}
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// Christmas-evening sky dome: deep blue night, a little stars, a glow on the horizon
const ENV = .35;            // reflections dimmed for the evening
scene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({side:THREE.BackSide, fog:false, map:canvasTex(512, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#050a1c'); gr.addColorStop(.42, '#101c3c'); gr.addColorStop(.6, '#2b3a63'); gr.addColorStop(.625, '#4a4f6e'); gr.addColorStop(.63, '#1a2230'); gr.addColorStop(1, '#0c1118');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rng(11); g.fillStyle = '#fff';
  for (let i = 0; i < 260; i++) { g.globalAlpha = .25 + r() * .6; g.fillRect(r() * w, Math.pow(r(), 1.6) * h * .5, r() < .1 ? 1.5 : 1, 1); }
  g.globalAlpha = 1; })})));

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 130);
// Room in viewer coordinates: X 0..3.3 (kitchen wall -> garden glass), Z 0..-5.4 (sofa end -> French doors), Y up.
const ROOM = {x0:0, x1:3.3, z0:-5.4, z1:0};
const CENTRE = new THREE.Vector3(1.2, 0.8, -2.95);

scene.add(new THREE.HemisphereLight(0x5d6fa3, 0x221c16, 0.16));
const sun = new THREE.DirectionalLight(0xa9bce8, 0.55);     // moonlight
sun.position.set(7.5, 8, -1.5); sun.target.position.copy(CENTRE); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sun.shadow.radius = 5;
Object.assign(sun.shadow.camera, {left:-6, right:6, top:6, bottom:-6, near:1, far:25});
// lights on: floor lamp, kitchen downlights, candles, fairy lights and the wall spotlights
const lampGlow = new THREE.PointLight(0xffb870, 3.2, 4.5, 2); lampGlow.position.set(2.94, 1.0, -2.93); scene.add(lampGlow);
const kitchenGlow = new THREE.PointLight(0xffd9a0, 7, 6, 1.6); kitchenGlow.position.set(-2.0, 2.0, -2.1); scene.add(kitchenGlow);
const kitchenGlow2 = new THREE.PointLight(0xffd9a0, 3, 4, 1.6); kitchenGlow2.position.set(-2.0, 2.0, -0.9); scene.add(kitchenGlow2);
const candleGlow = new THREE.PointLight(0xffa24a, 3.2, 4.2, 2); candleGlow.position.set(1.2, 1.3, -3.95); scene.add(candleGlow);
const tableGlow = new THREE.PointLight(0xffb565, 1.4, 3.2, 2); tableGlow.position.set(1.2, 1.25, -1.9); scene.add(tableGlow);
const fairyGlows = [[2.5, 2.0, -5.15], [3.05, 2.0, -3.7], [3.05, 2.0, -1.4]].map(([x, y, z]) => { const l = new THREE.PointLight(0xffc77a, 1.6, 3.6, 2); l.position.set(x, y, z); scene.add(l); return l; });
[[-0.42, 1.6], [-4.4, 1.95]].forEach(([z, y]) => {
  const sp = new THREE.SpotLight(0xffd8a8, 6, 4, 0.7, 0.6, 2); sp.position.set(0.17, y, z); sp.target.position.set(1.0, 0.75, z < -2 ? -4.0 : -0.8); scene.add(sp, sp.target);
});
// soft halo sprites so the little lights read as glowing
const haloTex = canvasTex(64, 64, (g, w) => { const gr = g.createRadialGradient(w/2, w/2, 0, w/2, w/2, w/2); gr.addColorStop(0, 'rgba(255,230,180,1)'); gr.addColorStop(.25, 'rgba(255,190,110,.55)'); gr.addColorStop(1, 'rgba(255,160,70,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });
const halos = [];
function addHalo(pos, size, opacity){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity}));
  sp.position.copy(pos); sp.scale.setScalar(size); sp.userData.base = opacity; sp.userData.ph = Math.random() * 6.3; scene.add(sp); halos.push(sp); return sp;
}
const flames = [];

// garden: lawn, patio, fence, hedge
{
  const lawn = new THREE.Mesh(new THREE.CircleGeometry(40, 40), new THREE.MeshStandardMaterial({color:0x5d6b86, roughness:.95}));
  lawn.rotation.x = -Math.PI/2; lawn.position.set(1.6, -0.07, -2.7); lawn.receiveShadow = true; scene.add(lawn);
  const patio = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshStandardMaterial({color:0x56627a, roughness:.95}));
  patio.rotation.x = -Math.PI/2; patio.position.set(2.2, -0.065, -7.2); patio.receiveShadow = true; scene.add(patio);
  const fm = new THREE.MeshStandardMaterial({color:0x8a4a38, roughness:1}), hm = new THREE.MeshStandardMaterial({color:0x2f5a2c, roughness:1}), sm = new THREE.MeshStandardMaterial({color:0x7a87a0, roughness:.9});
  [[11, -2.7, .2, 26], [1.6, -15, 26, .2], [1.6, 9, 26, .2]].forEach(([x, z, w, d]) => { const f = new THREE.Mesh(new THREE.BoxGeometry(w, 1.8, d), fm); f.position.set(x, .85, z); scene.add(f);

  const inside = p.x > ROOM.x0 + m && p.x < ROOM.x1 - m && p.z > ROOM.z0 + m && p.z < ROOM.z1 - m && p.y < 4.9 - (p.x / 3.3) * 2.5;
  // roof is on whenever the camera is below it (looking across the room), and lifts away when looking down from above
  const roofY = 5.0 - Math.min(Math.max(p.x, 0), 3.3) / 3.3 * 2.6;
  setVis(groups.roof, inside || p.y < roofY - 0.15);
  setVis(groups.near, inside || p.z < ROOM.z1);
  setVis(groups.far, inside || p.z > ROOM.z0);
  setVis(groups.right, inside || p.x < ROOM.x1);
  setVis(groups.left, inside || p.x > ROOM.x0);
  setVis(groups.kceil, p.y < 2.25);
}
function resize(){ const w = innerWidth, h = innerHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop(now => {
  if (tween) {
    const t = Math.min(1, (now - tween.s) / tween.ms), e = ease(t);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (t >= 1) tween = null;
  }
  if (!tween) {   // keep the point you are looking at within the house
    const t = controls.target, cx = Math.min(Math.max(t.x, -3.3), 3.6), cz = Math.min(Math.max(t.z, -5.8), 0.4), cy = Math.min(Math.max(t.y, 0.3), 1.6);
    camera.position.x += cx - t.x; camera.position.y += cy - t.y; camera.position.z += cz - t.z; t.set(cx, cy, cz);
  }
  controls.update(); cutaway();
  if (ring) { ring.userData.beam.visible = camera.position.distanceTo(ring.position) > 3.2; const s = 1 + Math.sin(now / 420) * .08; ring.scale.set(s, s, s); ring.material.opacity = .65 + Math.sin(now / 420) * .25; }
  const fl = Math.sin(now / 90) * .12 + Math.sin(now / 37) * .08 + Math.sin(now / 211) * .06;
  candleGlow.intensity = 3.2 * (1 + fl);
  for (let i = 0; i < flames.length; i++) { const f = flames[i]; f.scale.y = 1 + Math.sin(now / 70 + i * 1.7) * .12; f.scale.x = f.scale.z = 1 - Math.sin(now / 70 + i * 1.7) * .05; }
  for (const h of halos) h.material.opacity = h.userData.base * (h.scale.x > .14 ? (1 + fl * .8) : (.85 + Math.sin(now / 700 + h.userData.ph) * .15));
  for (const l of fairyGlows) l.intensity = 1.6 * (.94 + Math.sin(now / 900 + l.position.z) * .06);

  renderer.render(scene, camera);
});
