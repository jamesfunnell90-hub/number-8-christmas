<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Picture Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<style>
/* Picture Puzzles: 36 Christmas picture puzzles in six chapters. Two screens (chapters, puzzle) over an animated snow background. */
:root{
  --bg:#0c1f17; --panel:#17382b; --panel2:#10291f; --line:#2f5443;
  --ink:#f4ecd6; --dim:#b9c4b3; --gold:#d4b36a; --gold-hi:#f1d892; --gold-deep:#a2792b; --berry:#c4523f;
  --paper:#f7efda; --paper2:#eadfc2; --ink2:#10291f;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#1d4a38 0%,#10291f 45%,#0a1a13 100%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;touch-action:manipulation}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#burst{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.scr{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.scr>.w{max-width:440px;margin:0 auto;position:relative}
.scr.off{opacity:0;pointer-events:none}
#home.off{transform:translateX(-8%) scale(.98)}
#play.off{transform:translateX(10%)}

/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.lnk{text-decoration:none;background:none;border:0;color:var(--gold);font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:8px 0;display:flex;align-items:center;gap:8px}
.lnk svg{width:14px;height:14px}
.iconb{width:38px;height:38px;border-radius:50%;border:1px solid rgba(212,179,106,.35);background:rgba(16,41,31,.6);display:grid;place-items:center;padding:0}
.iconb svg{width:18px;height:18px}
.hero{text-align:center;padding:6px 0 4px;position:relative}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.title{font-family:var(--script);font-weight:400;font-size:clamp(46px,14.5vw,60px);line-height:1.08;margin:6px 0 0;
  background:linear-gradient(100deg,var(--gold-deep) 0%,var(--gold) 30%,#fff3cf 46%,var(--gold) 60%,var(--gold-deep) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(212,179,106,.25));animation:sheen 7s var(--ease-io) infinite}
@keyframes sheen{0%,20%{background-position:100% 0}60%,100%{background-position:0 0}}
.tag{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);opacity:.86;margin-top:2px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;color:var(--gold)}
.rule i{height:1px;width:22%;background:linear-gradient(90deg,transparent,var(--gold-deep))}
.rule i:last-child{background:linear-gradient(270deg,transparent,var(--gold-deep))}
.rule svg{width:12px;height:12px}

.card{position:relative;background:linear-gradient(180deg,rgba(29,70,54,.82),rgba(14,36,27,.88));border:1px solid rgba(212,179,106,.22);border-radius:18px;padding:16px;margin-top:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.prog{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .n b{font:700 30px var(--serif);color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.ring .n small{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-top:3px}
.prog .t{flex:1;min-width:0}
.k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.big{font:600 24px/1.15 var(--serif);margin:3px 0 2px}
.dim{color:var(--dim);font-size:13px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:999px;border:1px solid var(--gold);background:rgba(16,41,31,.6);color:var(--gold);
  font:500 12.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:0 22px;transition:transform .18s var(--ease),filter .18s var(--ease),opacity .2s}
.btn.solid{background:linear-gradient(180deg,#e6c77f,var(--gold) 55%,#b8954a);color:#17261c;border-color:#e9cf8e;box-shadow:0 6px 18px rgba(212,179,106,.25),inset 0 1px 0 rgba(255,255,255,.5);font-weight:600}
.btn:active{transform:scale(.96);filter:brightness(1.1)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.wide{width:100%}
.prog .btn{margin-top:10px}

.ch{padding:14px 14px 10px;overflow:hidden}
.ch-h{display:flex;align-items:baseline;gap:10px}
.ch-h .num{font:700 15px var(--serif);color:var(--gold);letter-spacing:.06em;min-width:22px}
.ch-h h3{font:600 23px/1.1 var(--serif);margin:0;flex:1}
.ch-h .sc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-h .sc b{color:var(--gold);font-weight:500}
.ch-s{font-size:12.5px;color:var(--dim);margin:2px 0 0 32px;font-style:italic;font-family:var(--serif);font-size:15px}
.garland{position:relative;height:112px;margin:4px -4px 0}
.garland>svg{position:absolute;left:0;top:0;width:100%;height:30px;overflow:visible}
.bb{position:absolute;top:6px;width:16.66%;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;transform-origin:50% 0;animation:sway 4.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
.bb .str{width:1.2px;background:linear-gradient(var(--gold-deep),var(--gold));}
.bb .cap{width:12px;height:7px;border-radius:2px 2px 1px 1px;background:linear-gradient(90deg,#8a6a2a,#e7cf8f,#8a6a2a);margin-bottom:-1px}
.ball{width:44px;height:44px;border-radius:50%;position:relative;display:grid;place-items:center;font:700 18px var(--serif);font-variant-numeric:lining-nums;transition:transform .25s var(--spring)}
.bb:active .ball{transform:scale(.9)}
.ball.g{background:radial-gradient(circle at 34% 30%,#5f9b7c 0%,#2a5e46 38%,#123227 75%,#0b2219 100%);color:rgba(244,236,214,.85);box-shadow:inset 0 -4px 8px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.35)}
.ball.s{background:radial-gradient(circle at 34% 30%,#fff6d6 0%,#f0d58d 22%,#c99d44 55%,#8a6526 100%);color:#3c2a0c;box-shadow:inset 0 -4px 8px rgba(80,50,0,.35),0 4px 14px rgba(212,179,106,.35)}
.ball.nx{background:radial-gradient(circle at 34% 30%,#f39a86 0%,#d6533f 35%,#9c2f22 75%,#6e1e15 100%);color:#fff2e2;box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),0 0 0 0 rgba(196,82,63,.6);animation:pulse 2.2s var(--ease-io) infinite}
@keyframes pulse{0%{box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),0 0 0 0 rgba(232,110,90,.55)}70%,100%{box-shadow:inset 0 -4px 8px rgba(0,0,0,.3),0 0 0 14px rgba(232,110,90,0)}}
.ball::after{content:"";position:absolute;left:24%;top:14%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1.5px);transform:rotate(-30deg)}
.bb .st{display:flex;gap:1px;margin-top:4px;height:10px}
.bb .st svg{width:8px;height:8px}

.lb{list-style:none;margin:10px 0 0;padding:0;counter-reset:r}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid rgba(47,84,67,.7);font-size:15px;opacity:0;animation:rise .6s var(--ease) forwards}
.lb li:first-child{border-top:0}
.lb li.me{background:linear-gradient(90deg,rgba(212,179,106,.14),transparent);border-radius:10px}
.lb .rk{width:20px;text-align:center;font:700 16px var(--serif);color:var(--dim)}
.lb li:nth-child(1) .rk{color:var(--gold)}
.av{width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font:600 15px var(--serif);border:1.5px solid rgba(212,179,106,.6);background:#24513f}
.av img{width:100%;height:100%;object-fit:cover}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .nm small{display:block;font-size:11px;color:var(--dim);letter-spacing:.04em}
.lb .v{font:700 20px var(--serif);color:var(--gold);display:flex;align-items:center;gap:4px;font-variant-numeric:lining-nums tabular-nums}
.lb .v svg{width:13px;height:13px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{text-align:center;margin-top:18px}
.how{font-size:13px;color:var(--dim);line-height:1.55;margin:8px 0 0}
.how b{color:var(--ink);font-weight:500}
.stag>*{opacity:0;animation:rise .7s var(--ease) forwards}

/* ---------- play ---------- */
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.pmid{text-align:center;flex:1;min-width:0}
.pmid .k{font-size:10px}
.pmid .c{font:600 19px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:2px}
.stars svg.go{animation:starGo .7s var(--ease) forwards}
@keyframes starGo{30%{transform:scale(1.6) rotate(20deg);filter:brightness(1.6)}100%{transform:scale(.8) translateY(4px);opacity:.22}}
.stars svg{width:15px;height:15px;transition:transform .35s var(--spring),opacity .3s}
.stars svg.lost{opacity:.22;transform:scale(.8)}
.clock{display:flex;align-items:center;gap:10px;max-width:320px;margin:12px auto 0;transition:opacity .4s}
.cbar{flex:1;height:5px;border-radius:3px;background:rgba(212,179,106,.15);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi));transform-origin:left center;transition:transform .2s linear,background .3s}
#clab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
.clock.warn .cbar i{background:linear-gradient(90deg,#9c2f22,#e8735e)}
.clock.warn #clab{color:#ef9a86;animation:glow 1s ease-in-out infinite}
.clock.last .cbar{display:none}.clock.last #clab{min-width:0;text-align:center;flex:1;color:var(--gold)}
.clue{margin:14px auto 0;max-width:400px;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);
  background:linear-gradient(135deg,rgba(212,179,106,.24),rgba(212,179,106,.06));box-shadow:0 0 28px rgba(212,179,106,.28);animation:clueIn .9s var(--spring) both}
.clue.q{animation:none}
.clue svg{width:32px;height:32px;flex:none;animation:glow 2s ease-in-out infinite}
.clue p{margin:2px 0 0;font:italic 600 19px/1.3 var(--serif);color:var(--ink)}
@keyframes clueIn{0%{opacity:0;transform:scale(.8) translateY(12px)}100%{opacity:1;transform:none}}
.sl.pop{animation:slPop .7s var(--spring)}
@keyframes slPop{0%{transform:scale(.4) rotate(-12deg)}100%{transform:none}}
.pdots{display:flex;justify-content:center;gap:5px;margin:10px 0 0}
.pdots i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(212,179,106,.55)}
.pdots i.s{background:var(--gold);border-color:var(--gold)}
.pdots i.cur{width:20px;border-radius:5px;background:var(--berry);border-color:var(--berry)}
.chip{display:flex;justify-content:center;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.chip span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;border:1px solid rgba(212,179,106,.4);border-radius:999px;padding:5px 11px;color:var(--gold);background:rgba(16,41,31,.5)}
.chip span.d{color:var(--dim);border-color:rgba(185,196,179,.25)}
.stage{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 4px;perspective:900px;min-height:90px}
.pic{flex:none;border-radius:16px;position:relative;background:radial-gradient(120% 100% at 30% 20%,#fffaf0 0%,var(--paper) 50%,var(--paper2) 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.4) inset,0 -3px 0 rgba(162,121,43,.25) inset;border:1px solid rgba(162,121,43,.55);
  animation:flipIn .8s var(--ease) both;transform-style:preserve-3d}
.pic::before{content:"";position:absolute;inset:5px;border-radius:11px;border:1px solid rgba(162,121,43,.28);pointer-events:none}
.pic svg{position:absolute;inset:9%;width:82%;height:82%;overflow:visible}
.pic.tx{display:grid;place-items:center}
.pic.tx span{font:700 1em/1 var(--serif);color:var(--ink2);letter-spacing:.02em;font-variant-numeric:lining-nums;position:relative;text-shadow:0 2px 0 rgba(162,121,43,.25)}
.pic.tx span.sm{font-size:.62em;letter-spacing:.06em}
@keyframes flipIn{0%{opacity:0;transform:rotateY(-80deg) translateY(16px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
.plus{color:var(--gold);font:600 26px/1 var(--serif);flex:none;animation:pop .5s var(--spring) both;text-shadow:0 0 12px rgba(212,179,106,.4)}
@keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.stage.solved .pic{animation:glowPic 1.4s var(--ease) both}
@keyframes glowPic{0%{box-shadow:0 10px 24px rgba(0,0,0,.35)}40%{box-shadow:0 0 0 3px var(--gold),0 0 36px rgba(241,216,146,.7)}100%{box-shadow:0 0 0 1px var(--gold),0 10px 24px rgba(0,0,0,.35)}}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;margin:18px 0 4px}
.wd{display:flex;gap:4px;align-items:flex-end}
.wd .pre{font:italic 600 20px var(--serif);color:var(--dim);margin-right:4px;align-self:center}
.sl{width:var(--s,34px);height:calc(var(--s,34px) * 1.2);border-radius:8px;background:linear-gradient(180deg,rgba(6,18,13,.75),rgba(16,41,31,.75));border:1px solid rgba(47,84,67,.9);border-bottom:2px solid rgba(212,179,106,.55);
  display:grid;place-items:center;font:700 calc(var(--s,34px) * .68)/1 var(--serif);color:var(--ink);position:relative;transition:background .3s,border-color .3s,transform .3s var(--spring)}
.sl.f{background:linear-gradient(180deg,#24513f,#17382b);border-color:rgba(212,179,106,.5)}
.sl.cur{border-bottom-color:var(--gold-hi);box-shadow:0 3px 0 -1px var(--gold-hi)}
.sl.lk{background:linear-gradient(180deg,#3a3017,#2a2310);border-color:var(--gold-deep);color:var(--gold-hi)}
.sl.fx{background:none;border:0;width:auto;min-width:10px;color:var(--gold)}
.sl.ok{animation:okflip .7s var(--ease) both;background:linear-gradient(180deg,#f3dc9c,#c99d44);color:#2a1c05;border-color:#f1d892}
@keyframes okflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.slots.bad{animation:shake .5s var(--ease-io)}
.slots.bad .sl:not(.fx){border-color:var(--berry);background:linear-gradient(180deg,#4a1d17,#2a120e)}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.msg{text-align:center;height:22px;margin-top:4px;font:italic 600 17px var(--serif);color:var(--gold);opacity:0;transition:opacity .3s}
.msg.on{opacity:1}

.pool{display:grid;grid-template-columns:repeat(var(--c,7),1fr);gap:7px;margin:10px auto 0;max-width:400px}
.tl{aspect-ratio:1/1.08;border-radius:10px;border:0;padding:0;position:relative;background:linear-gradient(180deg,#fffaf0 0%,var(--paper) 45%,#e3d4ad 100%);color:var(--ink2);
  font:700 25px/1 var(--serif);display:grid;place-items:center;box-shadow:0 3px 0 #b8975a,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 #fff;transition:transform .14s var(--ease),box-shadow .14s var(--ease),opacity .3s;
  animation:tileIn .5s var(--spring) both}
.tl:active{transform:translateY(2px);box-shadow:0 1px 0 #b8975a,0 3px 6px rgba(0,0,0,.3),inset 0 1px 0 #fff}
.tl.u{opacity:0;pointer-events:none;transform:scale(.6);animation:none}
.tl.gone{display:none}
.tl.x{opacity:0;pointer-events:none;transform:scale(0) rotate(30deg);transition:transform .45s var(--ease),opacity .45s;animation:none}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.7)}to{opacity:1;transform:none}}
.fly{position:fixed;z-index:30;pointer-events:none;border-radius:10px;background:linear-gradient(180deg,#fffaf0,var(--paper) 45%,#e3d4ad);color:var(--ink2);display:grid;place-items:center;font:700 25px/1 var(--serif);box-shadow:0 10px 24px rgba(0,0,0,.4);
  transition:transform .32s var(--ease),width .32s var(--ease),height .32s var(--ease),font-size .32s var(--ease)}
.tools{display:flex;justify-content:center;gap:10px;margin-top:18px}
.tools .btn{padding:0 16px;min-height:44px;font-size:11.5px}
.tools .btn svg{width:16px;height:16px}

/* sheets */
.veil{position:fixed;inset:0;z-index:20;background:rgba(5,14,10,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;background:linear-gradient(180deg,#1d4636,#10291f 70%);border:1px solid rgba(212,179,106,.35);border-bottom:0;border-radius:24px 24px 0 0;
  padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .5s var(--ease);box-shadow:0 -20px 50px rgba(0,0,0,.45);max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(244,236,214,.25);margin:0 auto 12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(8,20,14,.45);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px;transition:transform .15s var(--ease)}
.opt:active{transform:scale(.98)}
.opt[disabled]{opacity:.4}
.opt .ic{width:42px;height:42px;border-radius:12px;background:rgba(212,179,106,.12);display:grid;place-items:center;flex:none}
.opt .ic svg{width:22px;height:22px}
.opt b{display:block;font:600 19px/1.15 var(--serif)}
.opt small{color:var(--dim);font-size:12.5px}
.opt .cost{margin-left:auto;font-size:12px;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:3px}
.opt .cost svg{width:12px;height:12px}

.win{text-align:center}
.win h2{font:400 58px/1 var(--script);color:var(--gold);margin:6px 0 0;text-shadow:0 2px 18px rgba(212,179,106,.3)}
.win .ans{font:700 28px/1.15 var(--serif);letter-spacing:.06em;margin-top:8px;text-transform:uppercase}
.win .why{font:italic 600 17px/1.4 var(--serif);color:var(--dim);margin-top:6px}
.wst{display:flex;justify-content:center;gap:8px;margin:16px 0 6px}
.wst svg{width:40px;height:40px;opacity:0;transform:scale(.2) rotate(-40deg)}
.wst svg.in{animation:starIn .6s var(--spring) forwards}
.wst svg.off{animation:starOff .5s var(--ease) forwards}
@keyframes starIn{to{opacity:1;transform:none}}
@keyframes starOff{to{opacity:.18;transform:scale(.8)}}
.win .chd{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(212,179,106,.4);background:rgba(212,179,106,.08);font-size:13.5px;color:var(--ink)}

const KEYP='pp_v1_'+(ME||'guest');
let S=LS.get(KEYP,{s:{},r:{},x:{},t:{}});   // s: stars per solved puzzle, r: revealed slot positions, x: spares removed, t: seconds spent so far
['s','r','x','t'].forEach(k=>{if(!S[k])S[k]={}});
const save=()=>LS.set(KEYP,S);
const starsOf=()=>Object.values(S.s).reduce((a,b)=>a+b,0);
const solvedN=()=>Object.keys(S.s).length;

let BOARD={};    // everyone's totals from the database
let PHOTOS={};
function fsNum(v){return v?+(v.integerValue!=null?v.integerValue:v.doubleValue):0}
function loadBoard(){
  return fetch(FS+'puzzles?pageSize=60&key='+KEY).then(r=>r.ok?r.json():{}).then(j=>{
    (j.documents||[]).forEach(d=>{const n=decodeURIComponent(d.name.split('/').pop()),f=d.fields||{};
      BOARD[n]={stars:fsNum(f.stars),solved:fsNum(f.solved),prog:f.prog?f.prog.stringValue:''};});
    // merge my own saved progress from another phone
    const mine=BOARD[ME];
    if(mine&&mine.prog){let ch=false;mine.prog.split(',').forEach(t=>{const [id,v]=t.split(':');if(id&&+v&&!(S.s[id]>=+v)){S.s[id]=+v;ch=true}});if(ch){save();if(view==='home')renderHome(false)}}
  }).catch(()=>{});
}
function loadPhotos(){
  return fetch(FS+'photos?pageSize=60&key='+KEY).then(r=>r.ok?r.json():{}).then(j=>{(j.documents||[]).forEach(d=>{const n=decodeURIComponent(d.name.split('/').pop()),v=d.fields&&d.fields.img&&d.fields.img.stringValue;if(v)PHOTOS[n]=v;});}).catch(()=>{});
}
function push(){
  if(!ME)return;
  const prog=PZ.filter(p=>S.s[p.id]).map(p=>p.id+':'+S.s[p.id]).join(','),st=starsOf(),sv=solvedN();
  BOARD[ME]={stars:st,solved:sv,prog};
  const body={fields:{name:{stringValue:ME},stars:{integerValue:String(st)},solved:{integerValue:String(sv)},prog:{stringValue:prog},updated:{integerValue:String(Date.now())}}};
  fetch(FS+'puzzles/'+encodeURIComponent(ME)+'?key='+KEY,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(()=>{});
}

function tone(f,t0,d,v,type){const a=ac();if(!a||!SND)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
const sfx={
  tap(){tone(1320,0,.08,.05,'triangle')},
  back(){tone(700,0,.08,.04,'triangle')},
  bad(){tone(220,0,.18,.06,'sawtooth');tone(185,.1,.22,.05,'sawtooth')},
  hint(){[880,1175].forEach((f,i)=>tone(f,i*.07,.3,.05))},
  lose(){tone(660,0,.25,.045,'triangle');tone(494,.12,.35,.04,'triangle')},

function burst(x,y,n,spread){const cols=['#d4b36a','#f1d892','#c4523f','#f4ecd6','#4f9a72'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(spread||7)*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(spread||7)*.6,r:2+Math.random()*4,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sh:Math.random()<.35?1:0})}}

function frame(t){const dt=Math.min(50,t-lastT)/16.7;lastT=t;
  fc.clearRect(0,0,FW,FH);
  bokeh.forEach(b=>{b.y-=b.s*dt/FH*10;if(b.y<-.1)b.y=1.1;const x=b.x*FW+Math.sin(t/4000+b.p)*20,y=b.y*FH,al=.05+.05*Math.sin(t/1500+b.p);
    const g=fc.createRadialGradient(x,y,0,x,y,b.r);g.addColorStop(0,'rgba('+b.h+','+(al*1.6)+')');g.addColorStop(1,'rgba('+b.h+',0)');fc.fillStyle=g;fc.beginPath();fc.arc(x,y,b.r,0,6.28);fc.fill()});
  fc.fillStyle='#fff';
  flakes.forEach(f=>{f.y+=f.s*dt/FH*3;f.w+=.01*dt;if(f.y>1.02){f.y=-.02;f.x=Math.random()}const x=f.x*FW+Math.sin(f.w)*14;fc.globalAlpha=f.o;fc.beginPath();fc.arc(x,f.y*FH,f.r,0,6.28);fc.fill()});

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.fall?.02:.22)*dt;p.vx*=p.fall?1:.985;p.rot+=p.vr*dt;p.life-=(p.fall?.004:.012)*dt;
    if(p.life<=0||p.y>FH+30){parts.splice(i,1);continue}

/* ---------------- a puzzle ---------------- */
function rng(seed){let a=0;for(const ch of seed)a=(a*31+ch.charCodeAt(0))|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(p){
  const letters=p.a.replace(/[^A-Z]/g,'').split('');
  const n=letters.length,cols=n>18?8:7,total=Math.max(cols*2,Math.ceil((n+3)/cols)*cols);
  const r=rng(p.id),pool=letters.map(ch=>({ch,dec:false}));
  const COMMON='EEEAAAIIOOUTTNNSSRRLLDHCMPBGWYKV';
  while(pool.length<total)pool.push({ch:COMMON[Math.floor(r()*COMMON.length)],dec:true});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  pool.forEach(t=>{t.at=-1;t.gone=false});
  // slots: one per letter; words split on spaces; non-letters are shown fixed
  const words=[];let li=0;
  p.a.split(' ').forEach(w=>{const ws=[];for(const ch of w){if(/[A-Z]/.test(ch))ws.push({li:li++,ch,t:-1,lock:false});else ws.push({fx:ch})}words.push(ws)});
  const slots=[];words.forEach(w=>w.forEach(s=>{if(!s.fx)slots.push(s)}));
  return {p,pool,words,slots,cols,t:S.t[p.id]||0,done:!!S.s[p.id],live:false,last:performance.now()};
}
function openPuzzle(id){
  const p=PZ.find(x=>x.id===id);cur=p;G1=build(p);
  // put back any help already given, and catch up if time has run on
  (S.r[p.id]||[]).forEach(i=>placeReveal(i,true));
  if(S.x[p.id])removeSpares(true);
  if(!G1.done){const n=starsNow();if(n<=3&&!(S.r[p.id]||[]).length)helpReveal(true);if(n<=2&&!S.x[p.id])helpSpares(true)}
  G1.lvl=starsNow();
  if(G1.done){G1.slots.forEach(s=>{if(s.t<0){const k=G1.pool.findIndex(t=>!t.gone&&t.at<0&&t.ch===s.ch);if(k>=0){s.t=k;G1.pool[k].at=s.li}}})}
  renderPlay();show('play');$('play').scrollTop=0;
  const g=G1;setTimeout(()=>{if(G1===g){g.live=true;g.last=performance.now()}},1300);
}

function layoutPlay(){

function showClue(quiet){
  const b=$('clueBox');if(!b||b.firstChild)return;
  b.innerHTML='<div class="clue'+(quiet?' q':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="#d4b36a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="rgba(241,216,146,.25)"/></svg><div><div class="k">Big clue</div><p>'+esc(cur.clue)+'</p></div></div>';
  if(!quiet){sfx.hint();setMsg('');const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30,6)}
}
function firstEmpty(){return G1.slots.findIndex(s=>s.t<0)}
function drawSlots(){
  const fe=firstEmpty();let h='';
  G1.words.forEach((w,wi)=>{h+='<div class="wd">'+(wi===0&&cur.pre?'<span class="pre">'+cur.pre.charAt(0)+cur.pre.slice(1).toLowerCase()+'</span>':'');
    w.forEach(s=>{if(s.fx){h+='<span class="sl fx">'+esc(s.fx)+'</span>';return}
      const t=s.t>=0?G1.pool[s.t].ch:'';h+='<button class="sl'+(t?' f':'')+(s.lock?' lk':'')+(s.li===fe&&!G1.done?' cur':'')+'" data-s="'+s.li+'">'+t+'</button>'});h+='</div>'});
  $('slots').innerHTML=h;
}
function drawPool(first){
  $('pool').innerHTML=G1.pool.map((t,i)=>'<button class="tl'+(t.gone?' gone':t.at>=0?' u':'')+'" data-t="'+i+'" style="'+(first?'animation-delay:'+(.35+i*.025).toFixed(3)+'s':'animation:none')+'">'+t.ch+'</button>').join('');
  layoutPlay();
}
function flyTile(fromEl,toEl,ch,cb){
  if(!fromEl||!toEl||matchMedia('(prefers-reduced-motion: reduce)').matches){cb();return}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.textContent=ch;
  f.style.cssText='left:0;top:0;width:'+a.width+'px;height:'+a.height+'px;font-size:'+getComputedStyle(fromEl).fontSize+';transform:translate('+a.left+'px,'+a.top+'px)';
  document.body.appendChild(f);f.getBoundingClientRect();
  f.style.width=b.width+'px';f.style.height=b.height+'px';f.style.fontSize=getComputedStyle(toEl).fontSize;f.style.transform='translate('+b.left+'px,'+b.top+'px)';
  setTimeout(()=>{f.remove();cb()},300);
}
function setMsg(t){const m=$('msg');m.textContent=t||'';m.classList.toggle('on',!!t)}
$('playW').addEventListener('click',e=>{
  if(e.target.closest('#pBack')){if(G1&&!G1.done){S.t[cur.id]=G1.t;save()}sfx.back();closeSheet();renderHome(false);show('home');return}
  if(e.target.closest('#tNext')){goNext();return}
  if(!G1||G1.done||G1.busy)return;
  const tl=e.target.closest('.tl');
  if(tl){const i=+tl.dataset.t,t=G1.pool[i];if(t.at>=0||t.gone)return;const k=firstEmpty();if(k<0)return;
    const s=G1.slots[k];s.t=i;t.at=s.li;sfx.tap();setMsg('');
    const target=$('slots').querySelector('[data-s="'+s.li+'"]');tl.classList.add('u');
    G1.busy=true;flyTile(tl,target,t.ch,()=>{G1.busy=false;drawSlots();check()});return}
  const sl=e.target.closest('.sl[data-s]');
  if(sl){const s=G1.slots[+sl.dataset.s];if(s.t<0||s.lock)return;const t=G1.pool[s.t],ti=s.t;s.t=-1;t.at=-1;sfx.back();
    const tileEl=$('pool').querySelector('[data-t="'+ti+'"]');drawSlots();G1.busy=true;
    flyTile(sl,tileEl,t.ch,()=>{G1.busy=false;tileEl.classList.remove('u')});
    // clearing a letter from the middle keeps the rest where they are
    return}
  if(e.target.closest('#tShuf')){sfx.tap();const free=G1.pool.map((t,i)=>i).filter(i=>G1.pool[i].at<0);
    // shuffle only the tiles still in the tray, keeping placed tiles' indices stable
    const vals=free.map(i=>G1.pool[i]);for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
    free.forEach((i,k)=>G1.pool[i]=vals[k]);drawPool(true);return}
  if(e.target.closest('#tClr')){sfx.back();G1.slots.forEach(s=>{if(!s.lock&&s.t>=0){G1.pool[s.t].at=-1;s.t=-1}});setMsg('');drawSlots();drawPool(false);return}
});
function check(){
  if(firstEmpty()>=0)return;
  const guess=G1.slots.map(s=>G1.pool[s.t].ch).join(''),ans=cur.a.replace(/[^A-Z]/g,'');
  if(guess===ans){solve();return}
  sfx.bad();const el=$('slots');el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');
  setMsg(['Not quite. Try another way.','Close? Look again.','Say the pictures out loud.'][Math.floor(Math.random()*3)]);
  setTimeout(()=>el.classList.remove('bad'),700);
}
/* hints */
function placeReveal(li,quiet){
  const s=G1.slots[li];if(!s||s.lock)return false;
  if(s.t>=0){G1.pool[s.t].at=-1;s.t=-1}
  let k=G1.pool.findIndex(t=>!t.gone&&t.at<0&&t.ch===s.ch);
  if(k<0){const other=G1.slots.find(o=>!o.lock&&o.t>=0&&G1.pool[o.t].ch===s.ch&&o.ch!==s.ch);if(!other)return false;k=other.t;other.t=-1;G1.pool[k].at=-1}
  s.t=k;G1.pool[k].at=s.li;s.lock=true;return true;
}
function removeSpares(quiet){
  const need={};G1.slots.forEach(s=>need[s.ch]=(need[s.ch]||0)+1);
  const byL={};G1.pool.forEach((t,i)=>{if(!t.gone)(byL[t.ch]=byL[t.ch]||[]).push(i)});
  Object.keys(byL).forEach(ch=>{const list=byL[ch].sort((a,b)=>{const sa=G1.pool[a].at>=0?(G1.slots[G1.pool[a].at].ch===ch?0:1):2,sb=G1.pool[b].at>=0?(G1.slots[G1.pool[b].at].ch===ch?0:1):2;return sa-sb});
    list.slice(need[ch]||0).forEach(i=>{const t=G1.pool[i];if(t.at>=0){G1.slots[t.at].t=-1;t.at=-1}t.gone=true})});
  G1.spared=true;
}
/* solved */
function solve(){
  const stars=starsNow();G1.done=true;S.t[cur.id]=G1.t;const prev=S.s[cur.id]||0;S.s[cur.id]=Math.max(prev,stars);save();push();
  sfx.win();
  const els=[...$('slots').querySelectorAll('.sl:not(.fx)')];els.forEach((el,i)=>{el.style.animationDelay=(i*.045)+'s';el.classList.add('ok')});
  $('stage').classList.add('solved');
  const r=$('stage').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,90,9);
  const ci=cur.c,chDone=PZ.filter(p=>p.c===ci).every(p=>S.s[p.id]),allDone=solvedN()===TOTAL;
  setTimeout(()=>{
    if(chDone||allDone)rain();
    const nx=nextUnsolved(cur.n);
    openSheet('<div class="win"><div class="k">Puzzle '+cur.n+' solved</div><h2>'+['Got it!','Got there!','Well done!','Superb!','Brilliant!'][stars-1]+'</h2><div class="ans">'+(cur.pre?cur.pre+' ':'')+esc(cur.a)+'</div><div class="why">'+esc(cur.why)+'</div><div class="wst" id="wst">'+[0,1,2,3,4].map(()=>STAR()).join('')+'</div><div class="dim" style="margin-top:2px">Solved in '+fmtT(G1.t)+'</div>'
      +(allDone?'<div class="chd"><b>All 36 solved.</b> You have '+starsOf()+' of '+MAXS+' stars. A proper Christmas brain.</div>':chDone?'<div class="chd"><b>Chapter complete:</b> '+CH[ci].t+'. '+PZ.filter(p=>p.c===ci).reduce((a,p)=>a+S.s[p.id],0)+' of '+(6*MAXP)+' stars.</div>':'')
      +'<div class="acts">'+(nx?'<button class="btn solid wide" id="wN">Next puzzle</button>':'')+'<button class="btn wide" id="wH">All puzzles</button></div></div>');
    sheet.dataset.lock='1';
    const ss=[...$('wst').children];ss.forEach((s,i)=>setTimeout(()=>{if(i<stars){s.classList.add('in');sfx.star(i);const b=s.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,14,4)}else s.classList.add('off')},300+i*240));
    sheet.onclick=e=>{if(e.target.closest('#wN')){delete sheet.dataset.lock;closeSheet();goNext()}else if(e.target.closest('#wH')){delete sheet.dataset.lock;closeSheet();renderHome(false);show('home')}};
    drawStars();$('tools').innerHTML='<button class="btn solid" id="tNext">Next puzzle</button>';$('pool').style.display='none';setMsg(cur.why);
  },900);
}
function fmtT(t){t=Math.round(t);return t<60?t+' seconds':Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function goNext(){const nx=nextUnsolved(cur.n);if(!nx){renderHome(false);show('home');return}
  const pw=$('playW');pw.style.transition='opacity .25s,transform .25s';pw.style.opacity=0;pw.style.transform='translateX(-20px)';
  setTimeout(()=>{openPuzzle(nx.id);pw.style.transition='none';pw.style.transform='translateX(20px)';requestAnimationFrame(()=>{pw.style.transition='opacity .35s var(--ease),transform .45s var(--ease)';pw.style.opacity=1;pw.style.transform='none'})},250)}

/* keyboard on a computer: type letters, backspace to undo */
addEventListener('keydown',e=>{
  if(view!=='play'||!G1||G1.done||sheet.classList.contains('on'))return;
  if(e.key==='Backspace'){const filled=G1.slots.filter(s=>s.t>=0&&!s.lock);const last=filled[filled.length-1];if(last){G1.pool[last.t].at=-1;last.t=-1;drawSlots();drawPool(false)}return}
  const k=e.key.toUpperCase();if(!/^[A-Z]$/.test(k))return;
  const i=G1.pool.findIndex(t=>!t.gone&&t.at<0&&t.ch===k);if(i<0)return;
  const el=$('pool').querySelector('[data-t="'+i+'"]');if(el)el.click();
});

/* stop iOS zoom gestures */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

renderHome(true);
if(ME){Promise.all([loadBoard(),loadPhotos()]).then(()=>{if(view==='home')renderHome(false)})}
window.__pp={PZ,IC,S,openPuzzle,get G1(){return G1}};
})();
</script>
